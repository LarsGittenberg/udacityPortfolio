<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero sample B dark: Pillar and Tiles</title>
<!-- EXPERIMENT, not linked from the site. Course B in dark mode: the same composition, night ground, paper-coloured type, and a BLUE pillar (paper text on amber is only about 1.7:1, so the amber moves into the face disc). Original cream version: hero-lohman-b.html. Was: the paper-cream ground and the tile row of Lohman's page. Strict columns, one amber pillar that
     runs through everything, a name that crosses the pillar, and small captions that sit a little off the grid.
     Everything is placed in --u (1% of the window width, capped at 14.4px). Tokens copied from css/reskin-blue.css. -->
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,600|Source+Code+Pro:300,400" rel="stylesheet">
<style>
  :root {
    --u: min(1vw, 14.4px);
    --paper: #f1e6cc; --ink: #1d1a16; --magenta: #c314a4; --amber: #f2a51d; --blue: #004282;
    --purple: #8c1c78; --teal: #005e5e; --orange: #ff7f00; --gold: #ffcc00; --cream-text: #fffaf0;
    --night: #171412; --night-deep: #0c0a09;
    --font-display: "Doto", sans-serif; --font-body: "Montserrat", sans-serif; --font-mono: "Source Code Pro", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--night-deep); }
  body { background: var(--night); max-width: 1440px; margin: 0 auto; overflow-x: clip; }

  .stage { position: relative; height: calc(58 * var(--u)); background: var(--night); color: var(--paper); overflow: hidden; }
  .stage > * { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u)); }

  .strip  { --x: 0;  --y: 0;  --w: 7;  --h: 58; background: var(--purple); }
  /* the pillar: it runs the full height and the tile row steps across it */
  .pillar { --x: 65; --y: 0;  --w: 17; --h: 58; background: var(--blue); z-index: 1; }

  /* the tile row: four equal squares on a 17u module, with a 0 gutter, like a printed strip */
  .tile { --y: 31; --w: 17; --h: 17; z-index: 2; }
  .tile.t1 { --x: 14; background: var(--purple); }
  .tile.t2 { --x: 31; background: var(--orange); }
  .tile.t3 { --x: 48; background: var(--teal); }
  .tile::before { content: ""; position: absolute; inset: 11%; border-radius: 50%; background: var(--paper); }
  /* the motifs inside the discs, each built from one CSS shape */
  .tile::after { content: ""; position: absolute; }
  .t1::after { left: 36%; top: 30%; width: 28%; aspect-ratio: 69 / 75; background: var(--orange); clip-path: polygon(19% 0, 0 92%, 100% 100%); }
  .t2::after { left: 26%; top: 36%; width: 48%; aspect-ratio: 2 / 1; background: var(--blue); border-radius: 999px 999px 0 0; rotate: 40deg; }
  .t3::after { left: 33%; top: 33%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 0 calc(1.2 * var(--u)) var(--paper), 0 0 0 calc(1.8 * var(--u)) var(--ink); }

  /* the fourth tile is the pillar itself, wearing the face */
  .badge { --x: 66.5; --y: 32; --w: 14; --h: 14; z-index: 3; border-radius: 50%; }
  .badge::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--amber); }
  .badge .face { position: absolute; left: 12%; top: 13%; width: 76%; aspect-ratio: 876 / 893; }
  .badge img { position: absolute; inset: 0; width: 100%; }

  /* the name: ink on cream, crossing the amber pillar. Line two is indented a full tile, and sits a hair low */
  .name { --x: 13; --y: 3.4; --w: 90; --h: 26; z-index: 4; font-family: var(--font-display); font-optical-sizing: auto; font-weight: 900; font-variation-settings: "ROND" 0; text-transform: uppercase;
          font-size: calc(11.2 * var(--u)); line-height: 0.95; letter-spacing: -0.03em; color: var(--paper); }
  .name span { display: block; white-space: nowrap; }
  .name span:nth-child(2) { margin-left: calc(17 * var(--u)); margin-top: calc(0.5 * var(--u)); }

  /* captions: 1.05u of monospace, and a Montserrat voice that sits 1.4u off the tile edge on purpose */
  .vertical { --x: 2.2; --y: 5; --w: 3; --h: 48; z-index: 2; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-mono); font-weight: 300;
              text-transform: uppercase; letter-spacing: 0.22em; font-size: max(11px, calc(1.05 * var(--u))); color: var(--cream-text); }
  .kicker { --x: 14; --y: 49.6; --w: 40; --h: 3; height: auto; z-index: 4; font-family: var(--font-mono); font-weight: 400; text-transform: uppercase;
            letter-spacing: 0.22em; font-size: max(11px, calc(1.05 * var(--u))); color: var(--gold); }
  .tagline { --x: 15.4; --y: 51.8; --w: 48; --h: 4; height: auto; z-index: 4; font-family: var(--font-body); font-weight: 600; letter-spacing: -0.02em;
             font-size: max(17px, calc(2.4 * var(--u))); line-height: 1.15; }
  .tagline span { display: block; }
  .tagline span:nth-child(2) { color: var(--amber); }
</style>
</head>
<body>
  <div class="stage">
    <div class="strip"></div>
    <div class="pillar"></div>
    <div class="vertical">Creative technologist in product design</div>
    <h1 class="name"><span>Lawrence</span><span>Getubig</span></h1>
    <div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div>
    <div class="badge" role="img" aria-label="Illustrated portrait of Lawrence Getubig">
      <div class="face">
        <img src="../images/hero/face1.svg" alt=""><img src="../images/hero/face2.svg" alt=""><img src="../images/hero/face3.svg" alt="">
        <img src="../images/hero/face4.svg" alt=""><img src="../images/hero/face5.svg" alt="">
      </div>
    </div>
    <p class="kicker">Nº 01 &mdash; Hello</p>
    <h2 class="tagline"><span>Synthesis with perspective,</span><span>playful by design.</span></h2>
  </div>
</body>
</html>
