<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero sample A: Overprint</title>
<!-- EXPERIMENT, not linked from the site. Course A, "Overprint": the name is printed across three blocks of colour and spills off all of them, a hair out of register.
     Everything is placed in --u (1% of the window width, capped at 14.4px), the same unit as the home page. Tokens copied from css/reskin-blue.css. -->
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,600|Source+Code+Pro:300,400" rel="stylesheet">
<style>
  :root {
    --u: min(1vw, 14.4px);
    --paper: #f1e6cc; --ink: #1d1a16; --magenta: #c314a4; --amber: #f2a51d; --blue: #004282;
    --purple: #8c1c78; --teal: #005e5e; --orange: #ff7f00; --gold: #ffcc00; --cream-text: #fffaf0;
    --night: #171412; --night-deep: #0c0a09;
    --font-display: "Doto", sans-serif; --font-body: "Montserrat", sans-serif; --font-mono: "Source Code Pro", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--night-deep); }
  body { background: var(--night); color: var(--cream-text); max-width: 1440px; margin: 0 auto; overflow-x: clip; }

  /* every piece is placed by four numbers, in u: --x --y --w --h */
  .stage { position: relative; height: calc(54 * var(--u)); }
  .stage > * { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u)); }

  .slab   { --x: 14; --y: 8;  --w: 56; --h: 34; background: var(--blue); z-index: 1; }
  .pillar { --x: 66; --y: 0;  --w: 11; --h: 50; background: var(--orange); z-index: 0; }
  .strip  { --x: 0;  --y: 0;  --w: 5;  --h: 54; background: var(--purple); z-index: 0; }

  /* the name: Doto 900, two lines, the second one pushed right and a touch low, so the two rows never quite agree */
  .name { --x: 9; --y: 2.6; --w: 90; --h: 26; z-index: 3; font-family: var(--font-display); font-optical-sizing: auto; font-weight: 900; font-variation-settings: "ROND" 0; text-transform: uppercase;
          font-size: calc(12.5 * var(--u)); line-height: 0.95; letter-spacing: -0.03em; color: var(--cream-text); }
  .name span { display: block; white-space: nowrap; }
  .name span:nth-child(2) { margin-left: calc(10 * var(--u)); margin-top: calc(0.5 * var(--u)); }

  /* the small voices: the contrast is the point. 12.5u of pixels against 1.1u of monospace capitals */
  .kicker { --x: 16.4; --y: 30; --w: 40; --h: 3; z-index: 3; height: auto; font-family: var(--font-mono); font-weight: 300; text-transform: uppercase;
            letter-spacing: 0.22em; font-size: max(11px, calc(1.05 * var(--u))); color: var(--gold); }
  .tagline { --x: 16; --y: 33.2; --w: 40; --h: 9; z-index: 3; height: auto; font-family: var(--font-body); font-weight: 600; letter-spacing: -0.02em;
             font-size: max(18px, calc(2.9 * var(--u))); line-height: 1.12; color: var(--cream-text); }
  .tagline span { display: block; }
  .tagline span:nth-child(3) { margin-top: 0.4em; }
  .vertical { --x: 1.2; --y: 4; --w: 3; --h: 46; z-index: 2; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-mono); font-weight: 300;
              text-transform: uppercase; letter-spacing: 0.22em; font-size: max(11px, calc(1.05 * var(--u))); color: var(--cream-text); }

  /* the face badge straddles the slab, the pillar and the dark: three grounds at once */
  .badge { --x: 62; --y: 29; --w: 21; --h: 21; z-index: 4; border-radius: 50%; background: var(--amber); }
  .badge .face { position: absolute; left: 12%; top: 13%; width: 76%; aspect-ratio: 876 / 893; }
  .badge img { position: absolute; inset: 0; width: 100%; }

  /* a few small accents, each off the grid on purpose */
  .dot  { --x: 86; --y: 36; --w: 5;   --h: 5;   z-index: 2; border-radius: 50%; background: var(--magenta); }
  .tri  { --x: 90; --y: 41; --w: 5.4; --h: 6.4; z-index: 2; background: var(--teal); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  .half { --x: 5.6; --y: 41; --w: 11; --h: 5.5; z-index: 2; background: var(--amber); border-radius: 999px 999px 0 0; rotate: -12deg; }
</style>
</head>
<body>
  <div class="stage">
    <div class="strip"></div>
    <div class="pillar"></div>
    <div class="slab"></div>
    <div class="half"></div>
    <div class="vertical">Creative technologist in product design</div>
    <h1 class="name"><span>Lawrence</span><span>Getubig</span></h1>
    <p class="kicker">Nº 01 &mdash; Hello</p>
    <h2 class="tagline"><span>Synthesis with</span><span>perspective.</span><span>Playful by design.</span></h2>
    <div class="dot"></div>
    <div class="tri"></div>
    <div class="badge" role="img" aria-label="Illustrated portrait of Lawrence Getubig">
      <div class="face">
        <img src="../images/hero/face1.svg" alt=""><img src="../images/hero/face2.svg" alt=""><img src="../images/hero/face3.svg" alt="">
        <img src="../images/hero/face4.svg" alt=""><img src="../images/hero/face5.svg" alt="">
      </div>
    </div>
  </div>
</body>
</html>
